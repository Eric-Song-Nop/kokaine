name: npm tooling

on:
  pull_request:
  push:

jobs:
  pocketjs:
    name: PocketJS bridge contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: npm ci --ignore-scripts
      - name: Install managed Koka 3.2.3
        run: node --input-type=module -e "import { resolveCompiler } from './packages/cli/src/toolchain.js'; const { binary } = await resolveCompiler('3.2.3'); console.log('KOKA_BIN=' + binary);" >> "$GITHUB_ENV"
      - name: Test native Koka suite
        run: make test-native KOKA="$KOKA_BIN"
      - name: Test Pocket Koka renderer
        run: make test-pocketjs-runtime KOKA="$KOKA_BIN"
      - run: make test-pocketjs-bridge
      - run: npm pack --dry-run --workspace @kokaine/pocketjs

  pocketjs-exact:
    name: PocketJS 0.6 bundle, WASM, and browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pocket-stack/pocketjs
          ref: 1f848dcdb2629e3c6373710cd0aa16d775ea2ad3
          path: .ci/pocketjs-v0.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --ignore-scripts
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .ci/pocketjs-v0.6.0
      - name: Install managed Koka 3.2.3
        run: node --input-type=module -e "import { resolveCompiler } from './packages/cli/src/toolchain.js'; const { binary } = await resolveCompiler('3.2.3'); console.log('KOKA_BIN=' + binary);" >> "$GITHUB_ENV"
      - run: rustup target add wasm32-unknown-unknown
      - name: Test exact Pocket bundle and Rust/WASM host
        run: make test-pocketjs-wasm POCKETJS_CHECKOUT="$GITHUB_WORKSPACE/.ci/pocketjs-v0.6.0" KOKA="$KOKA_BIN"
      - name: Install pinned Chromium
        run: uv run --with "playwright==1.61.0" python -m playwright install --with-deps chromium
      - name: Test official Pocket browser host
        run: uv run --with "playwright==1.61.0" python test/browser_pocketjs.py

  playground-cache:
    name: Playground generated cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Regenerate the pinned Kokaine cache
        run: npm run precompile:kokaine --workspace @kokaine/playground
      - name: Reject generated cache drift
        shell: bash
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all -- \
            packages/playground/vendor/kokaine-precompiled-v3.2.4 \
            packages/playground/public/koka)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            git diff -- \
              packages/playground/vendor/kokaine-precompiled-v3.2.4 \
              packages/playground/public/koka
            exit 1
          fi
      - run: npm run test:wasm --workspace @kokaine/playground

  unit:
    name: ${{ matrix.os }} / ${{ matrix.client }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        client: [npm, pnpm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.client == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - if: matrix.client == 'npm'
        run: npm ci --ignore-scripts
      - if: matrix.client == 'pnpm'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm test

  integration:
    name: managed compiler and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node packages/create-kokaine/bin/create-kokaine.js integration-app
      - run: npm pkg set 'dependencies.@kokaine/core=file:..' 'devDependencies.@kokaine/cli=file:../packages/cli' --prefix integration-app
      - run: npm install --ignore-scripts --prefix integration-app
      - run: npm run doctor --prefix integration-app -- --json
      - run: npm run build --prefix integration-app
