name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: the Emscripten wasmweb proof is too slow for every push.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOKA_VERSION: 3.2.3
  PLAYWRIGHT: playwright==1.61.0

jobs:
  native:
    name: Native Koka ${{ matrix.koka }} suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range on Linux; macOS on the newest.
        include:
          - { os: ubuntu-latest, koka: 3.2.3 }
          - { os: ubuntu-latest, koka: 3.2.9 }
          - { os: macos-latest, koka: 3.2.9 }
    env:
      KOKA_VERSION: ${{ matrix.koka }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install managed Koka
        run: echo "KOKA_BIN=$(make -s print-managed-koka)" >> "$GITHUB_ENV"
      - run: make test-native KOKA="$KOKA_BIN"
      - run: make test-pocketjs-runtime KOKA="$KOKA_BIN"

  browser:
    name: Browser DOM and report suites (Koka ${{ matrix.koka }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        koka: [3.2.3, 3.2.9]
    env:
      KOKA_VERSION: ${{ matrix.koka }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install managed Koka
        run: echo "KOKA_BIN=$(make -s print-managed-koka)" >> "$GITHUB_ENV"
      - name: Install pinned Chromium
        run: uv run --with "$PLAYWRIGHT" python -m playwright install --with-deps chromium
      - run: make test-browser KOKA="$KOKA_BIN"
      - run: make test-report KOKA="$KOKA_BIN"

  wasm-proof:
    name: wasmweb retained-callback proof
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          # Verified locally with the wasmweb proof on 2026-11-01.
          version: 6.0.13
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install managed Koka
        run: echo "KOKA=$(make -s print-managed-koka)" >> "$GITHUB_ENV"
      - run: make test-wasm

  pocketjs:
    name: PocketJS bridge contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: make test-pocketjs-bridge
      - run: npm pack --dry-run
        working-directory: packages/pocketjs

  pocketjs-exact:
    # The adapter is frozen at PocketJS 0.6 (see packages/pocketjs/README.md),
    # so its heavy exact-checkout lane runs weekly and on demand only.
    name: PocketJS 0.6 bundle, WASM, and browser
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pocket-stack/pocketjs
          ref: 1f848dcdb2629e3c6373710cd0aa16d775ea2ad3
          path: .ci/pocketjs-v0.6.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .ci/pocketjs-v0.6.0
      - name: Install managed Koka
        run: echo "KOKA_BIN=$(make -s print-managed-koka)" >> "$GITHUB_ENV"
      - run: rustup target add wasm32-unknown-unknown
      - name: Test exact Pocket bundle and Rust/WASM host
        run: make test-pocketjs-wasm POCKETJS_CHECKOUT="$GITHUB_WORKSPACE/.ci/pocketjs-v0.6.0" KOKA="$KOKA_BIN"
      - name: Install pinned Chromium
        run: uv run --with "$PLAYWRIGHT" python -m playwright install --with-deps chromium
      - name: Test official Pocket browser host
        run: uv run --with "$PLAYWRIGHT" python test/browser_pocketjs.py

  playground:
    name: Playground cache, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The Koka compiler/LSP WASM (~34 MiB) and the upstream stdlib sources
      # behind koka-runtime.json.gz are not tracked in git. sync-koka-assets.mjs
      # keeps them in a content-addressed cache under ~/.cache/kokaine/playground
      # and verifies every file against the pins in public/koka/assets.json.
      - name: Cache pinned Koka browser assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kokaine/playground
          key: koka-playground-assets-${{ hashFiles('packages/playground/public/koka/assets.json', 'packages/playground/scripts/sync-koka-assets.mjs') }}
          restore-keys: koka-playground-assets-
      - name: Fetch and verify pinned Koka browser assets
        run: pnpm --filter @kokaine/playground run assets:koka
      - name: Regenerate the pinned Kokaine cache
        run: pnpm --filter @kokaine/playground run precompile:kokaine
      # vendor/kokaine-precompiled-v3.2.4 is the only tracked copy of the
      # Kokaine precompiled cache; public/koka/assets.json pins the runtime
      # bundle derived from it. Everything else under public/ is gitignored.
      - name: Reject generated cache drift
        shell: bash
        run: |
          paths=(
            packages/playground/vendor/kokaine-precompiled-v3.2.4
            packages/playground/public/koka/assets.json
          )
          status="$(git status --porcelain=v1 --untracked-files=all -- "${paths[@]}")"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            git diff -- "${paths[@]}"
            exit 1
          fi
      - run: pnpm --filter @kokaine/playground run test:wasm
      - run: pnpm --filter @kokaine/playground run test:architecture
      # `build` runs prebuild (asset fetch/verify, DevTools copy, release
      # staging, and workbench compile), then `tsc --noEmit` and `vite build`.
      # `test` has its own pretest hook that stages the release it needs.
      - run: pnpm --filter @kokaine/playground run build
      - run: pnpm --filter @kokaine/playground run test

  unit:
    name: Tooling unit tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # CLI package tests plus `test:sidecar`: `node --check` and the
      # node:test suites for the JavaScript files Koka pastes into generated
      # modules (src/kokaine/**/*-inline.js).
      - run: pnpm test

  integration:
    # Consumer compatibility matters for generated applications, so this is
    # the one place both npm and pnpm are exercised.
    name: Generated app with ${{ matrix.client }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [npm, pnpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node packages/create-kokaine/bin/create-kokaine.js integration-app
      - run: npm pkg set 'dependencies.@kokaine/core=file:../packages/core' 'devDependencies.@kokaine/cli=file:../packages/cli' --prefix integration-app
      - if: matrix.client == 'npm'
        working-directory: integration-app
        run: |
          npm install --ignore-scripts
          npm run doctor -- --json
          npm run build
      - if: matrix.client == 'pnpm'
        working-directory: integration-app
        run: |
          pnpm install --ignore-scripts --ignore-workspace
          pnpm run doctor --json
          pnpm run build
